name: snap_reels
description: A powerful, customizable Flutter widget for creating TikTok/Instagram-style vertical video reels with advanced features like caching, analytics, and rich interactions.
version: 3.1.0
homepage: https://github.com/PAzter1101/snap_reels
repository: https://github.com/PAzter1101/snap_reels
issue_tracker: https://github.com/PAzter1101/snap_reels/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  connectivity_plus: ^7.1.1
  crypto: ^3.0.6
  device_info_plus: ^13.0.0
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  get: ^4.7.3
  iconly: ^1.0.1
  json_annotation: ^4.12.0
  like_button: ^2.1.0
  lottie: ^3.3.3
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.6.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  import_sorter: ^4.6.0
  json_serializable: ^6.14.0
  mockito: ^5.6.4
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  very_good_analysis: ^10.2.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

import_sorter:
  ignored_files:
    - ".*\\.mocks\\.dart$"
    - ".*\\.g\\.dart$"
    - ".*\\.freezed\\.dart$"

flutter:
  assets:
    - assets/reel-loading.json
  plugin:
    platforms:
      android:
        package: com.pazter1101.snap_reels
        pluginClass: SnapReelsPlugin
      ios:
        pluginClass: SnapReelsPlugin
      macos:
        pluginClass: SnapReelsPlugin
      linux:
        pluginClass: SnapReelsPlugin
      windows:
        pluginClass: SnapReelsPluginCApi
      web:
        pluginClass: SnapReelsWebPlugin
        fileName: snap_reels_web.dart
